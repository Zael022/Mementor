openapi: 3.0.3
info:
  title: MENTOR AI API — subconjunto de ejemplo
  version: 0.1.0
  description: Esquema inicial. Completar contrato y endpoints durante la implementación.
servers:
  - url: http://localhost:3001/api/v1
paths:
  /health:
    get:
      summary: Estado de la API
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      summary: Sesión actual
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': {description: No autenticado}
  /courses:
    get:
      summary: Lista cursos a los que el usuario tiene acceso
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200':
          description: Cursos filtrados por sesión e institución
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Course'}
    post:
      summary: Crear curso (docente autorizado o administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title]
              properties:
                code: {type: string, maxLength: 40}
                title: {type: string, maxLength: 180}
                description: {type: string}
      responses:
        '201': {description: Creado}
        '403': {description: No autorizado}
  /assessments/{assessmentId}/attempts:
    post:
      summary: Iniciar intento de cuestionario
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '201': {description: Intento creado}
        '403': {description: No matriculado}
  /attempts/{attemptId}/submit:
    post:
      summary: Enviar respuestas y calcular nota de forma determinista
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId, selectedOptionId]
                    properties:
                      questionId: {type: integer, format: int64}
                      selectedOptionId: {type: integer, format: int64}
      responses:
        '200': {description: Intento calificado}
        '409': {description: Ya enviado}
  /courses/{courseId}/tutor/threads:
    post:
      summary: Crear conversación del tutor asociada a curso autorizado
      parameters:
        - in: path
          name: courseId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '201': {description: Hilo creado}
        '403': {description: Sin matrícula o permisos}
components:
  schemas:
    Course:
      type: object
      required: [id, code, title, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        title: {type: string}
        status: {type: string, enum: [draft, published, archived]}
    MeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: {type: integer, format: int64}
            displayName: {type: string}
            role: {type: string, enum: [platform_admin, institution_admin, teacher, student]}
