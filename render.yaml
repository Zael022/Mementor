# Blueprint de Render para la API de MENTOR AI (plan gratuito), rama despliegue-nube.
# Arquitectura: Vercel (frontend) → Render (esta API) → Supabase (PostgreSQL y archivos). Guía: docs/despliegue.md.
# Los valores secretos (sync: false) se escriben en el panel de Render; nunca en el repositorio.
services:
  - type: web
    name: mentor-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm ci
    # Aplica las migraciones pendientes antes de arrancar (el plan gratuito no tiene paso previo al despliegue).
    # En un plan de pago: preDeployCommand: npm run db:migrate y startCommand: npm start (ver docs/despliegue.md §3).
    # Las migraciones solo agregan; lo que se borra va en una versión posterior (ampliar y luego contraer).
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    branch: despliegue-nube
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.2
      # Vercel + Render = 2 proxies. Comprobar también la URL directa de Render antes de abrir (docs/despliegue.md §3).
      - key: TRUST_PROXY
        value: "2"
      - key: RAG_PROVIDER
        value: local
      # El disco del plan gratuito se borra al reiniciar: los originales van a un bucket privado de Supabase Storage.
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      # Clave secreta del proyecto (sb_secret_…): solo vive en Render, nunca en Vercel ni en el navegador.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: mentor-originales
      # Base de datos: PostgreSQL de Supabase por el «Session pooler» (IPv4, puerto 5432).
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # Certificado raíz que entrega Supabase (Database Settings → SSL Configuration), pegado completo.
      - key: DB_SSL_CA_PEM
        sync: false
      # El pooler gratuito admite pocas conexiones: la API usa como máximo 5.
      - key: DB_POOL_MAX
        value: "5"
      # Modo de prueba apagado: las cuentas de prueba no entran en la nube (ADR 0011).
      - key: DEMO_MODE
        value: "off"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      # Router de modelos (opcional): si quedan vacíos se usa AI_MODEL. Ver docs/adr/0009-capas-ia.md.
      - key: AI_MODEL_RAPIDO
        sync: false
      - key: AI_MODEL_AVANZADO
        sync: false
      - key: AI_RESPONSE_CACHE
        value: "on"
      - key: AI_PROMPT_CACHE
        value: "off"
      - key: N8N_INTEGRATION_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
